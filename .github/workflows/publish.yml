name: Publish to PyPI

# Parked posture: PYPI_API_TOKEN / the `pypi` environment are not configured,
# so a release-triggered run would always fail at the publish job. Manual
# dispatch only until the owner configures the token — then restore
# `release: types: [published]` as the trigger and flip README's install
# section back to PyPI-first.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: |
          uv venv --python 3.12
          uv pip install build
          .venv/bin/python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540549e92d1f4226f89615c4 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@634f93cb293d8c8a7a23a7e5d118329584b26e63 # v5.0.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@edfa8f6c8ff7f1c53c2ca1b5942d99c26ba3a4cc # v1.13.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
